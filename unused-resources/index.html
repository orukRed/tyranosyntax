<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>未使用リソース検出</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f2f5;
        color: #333;
        margin: 0;
        padding: 20px;
      }
      h1 {
        margin: 0 0 6px 0;
        font-size: 22px;
        color: #c0392b;
      }
      .subtitle {
        font-size: 13px;
        color: #666;
        margin-bottom: 16px;
        line-height: 1.6;
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
      }
      #toolbar input[type="text"] {
        flex: 1;
        min-width: 200px;
        padding: 7px 12px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
        transition: border-color 0.2s;
      }
      #toolbar input[type="text"]:focus {
        border-color: #c0392b;
      }
      #toolbar select {
        padding: 7px 12px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: #fff;
        outline: none;
        cursor: pointer;
      }
      #count {
        font-size: 13px;
        color: #666;
        margin-left: auto;
      }
      .btn {
        padding: 7px 14px;
        font-size: 13px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn-outline {
        background: #fff;
        border: 1px solid #ccc;
        color: #444;
      }
      .btn-danger {
        background: #c0392b;
        color: #fff;
      }
      .btn-danger:disabled {
        background: #e9a9a3;
        cursor: not-allowed;
        opacity: 1;
      }
      .btn-refresh {
        background: #3498db;
        color: #fff;
      }
      .table-wrapper {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      thead {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #c0392b;
        color: #fff;
      }
      thead th {
        padding: 10px 12px;
        text-align: left;
        user-select: none;
        white-space: nowrap;
      }
      tbody tr:nth-child(even) {
        background: #fdf4f4;
      }
      tbody tr:hover {
        background: #fce8e8;
      }
      tbody td {
        padding: 8px 12px;
        border-bottom: 1px solid #f0e0e0;
        vertical-align: middle;
      }
      .thumb {
        width: 56px;
        height: 42px;
        object-fit: cover;
        border-radius: 3px;
        border: 1px solid #ddd;
        display: block;
      }
      .icon-file {
        width: 56px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        color: #aaa;
      }
      .tag {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: bold;
        text-transform: uppercase;
        color: #fff;
      }
      .tag-image {
        background: #27ae60;
      }
      .tag-bgimage {
        background: #2980b9;
      }
      .tag-fgimage {
        background: #8e44ad;
      }
      .tag-sound {
        background: #e67e22;
      }
      .tag-bgm {
        background: #16a085;
      }
      .tag-video {
        background: #d35400;
      }
      .tag-others {
        background: #7f8c8d;
      }
      .tag-scenario {
        background: #c0392b;
      }
      .tag-script {
        background: #2c3e50;
      }
      .tag-text {
        background: #5d6d7e;
      }
      .path-text {
        font-family: monospace;
        font-size: 12px;
        word-break: break-all;
      }
      #empty-msg {
        text-align: center;
        padding: 40px;
        color: #888;
        font-size: 15px;
      }
      /* モーダル */
      #modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }
      #modal-overlay.active {
        display: flex;
      }
      #modal {
        background: #fff;
        border-radius: 8px;
        padding: 28px 32px;
        max-width: 480px;
        width: 90%;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }
      #modal h2 {
        margin: 0 0 12px 0;
        font-size: 18px;
        color: #c0392b;
      }
      #modal p {
        font-size: 14px;
        line-height: 1.7;
        margin: 0 0 20px 0;
      }
      #modal .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      #loading {
        text-align: center;
        padding: 40px;
        color: #888;
        font-size: 15px;
      }
      /* アコーディオンヘッダー行 */
      tr.accordion-header {
        background: #f5d5d3 !important;
        cursor: pointer;
        user-select: none;
      }
      tr.accordion-header:hover {
        background: #eebab7 !important;
      }
      tr.accordion-header td {
        padding: 7px 12px;
        font-weight: bold;
        font-size: 13px;
        border-bottom: 2px solid #c0392b;
      }
      .accordion-label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .accordion-icon {
        font-style: normal;
        font-size: 11px;
        transition: transform 0.15s;
        display: inline-block;
        width: 14px;
        text-align: center;
      }
      .accordion-icon.open::before { content: "▼"; }
      .accordion-icon.closed::before { content: "▶"; }
      /* ソート可能な列ヘッダー */
      thead th.sortable {
        cursor: pointer;
      }
      thead th.sortable:hover {
        background: #a93226;
      }
      thead th .sort-icon {
        margin-left: 4px;
        font-size: 10px;
        opacity: 0.6;
      }
      thead th.sort-asc .sort-icon::after  { content: "▲"; opacity: 1; }
      thead th.sort-desc .sort-icon::after { content: "▼"; opacity: 1; }
      thead th:not(.sort-asc):not(.sort-desc) .sort-icon::after { content: "⇅"; opacity: 0.5; }
    </style>
  </head>
  <body>
    <h1>⚠️ 未使用リソース検出</h1>
    <p class="subtitle">
      シナリオ・スクリプトファイルから参照されていないリソースファイルの一覧です。<br />
      変数などで動的に参照されている可能性があります。ご注意ください。<br />
      <strong style="color: #c0392b; font-size: 14px"
        >削除したファイルは元に戻せません。必ずバックアップを取ったうえで実行してください。</strong
      >
    </p>

    <div id="toolbar">
      <input
        type="text"
        id="search"
        placeholder="ファイル名で絞り込み..."
        oninput="applyFilter()"
      />
      <select id="type-filter" onchange="applyFilter()">
        <option value="">すべてのリソースタイプ</option>
        <option value="image">image</option>
        <option value="bgimage">bgimage</option>
        <option value="fgimage">fgimage</option>
        <option value="sound">sound</option>
        <option value="bgm">bgm</option>
        <option value="video">video</option>
        <option value="scenario">scenario</option>
        <option value="others">others</option>
      </select>
      <select id="project-filter" onchange="applyFilter()">
        <option value="">すべてのプロジェクト</option>
      </select>
      <button class="btn btn-outline" onclick="selectAll()">全選択</button>
      <button class="btn btn-outline" onclick="deselectAll()">全解除</button>
      <button class="btn btn-outline" onclick="expandAll()">すべて開く</button>
      <button class="btn btn-outline" onclick="collapseAll()">すべて閉じる</button>
      <button class="btn btn-refresh" onclick="loadData()">
        🔄 最新の情報に更新
      </button>
      <button
        class="btn btn-danger"
        id="delete-btn"
        disabled
        onclick="confirmDelete()"
      >
        選択したファイルをゴミ箱に移動
      </button>
      <span id="count"></span>
    </div>

    <div id="loading">読み込み中...</div>
    <div class="table-wrapper" id="table-wrapper" style="display: none">
      <table>
        <thead>
          <tr>
            <th>
              <input
                type="checkbox"
                id="check-all"
                onchange="toggleAll(this)"
              />
            </th>
            <th>サムネイル</th>
            <th class="sortable" onclick="setSort('fileName')">ファイル名<span class="sort-icon"></span></th>
            <th class="sortable" onclick="setSort('relativePath')">相対パス<span class="sort-icon"></span></th>
            <th>リソースタイプ</th>
            <th>プロジェクト</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty-msg" style="display: none">
        未使用リソースは見つかりませんでした。
      </div>
    </div>

    <!-- 削除確認モーダル -->
    <div id="modal-overlay">
      <div id="modal">
        <h2>⚠️ ゴミ箱に移動する前に確認</h2>
        <p id="modal-body"></p>
        <div class="modal-actions">
          <button class="btn btn-outline" onclick="closeModal()">
            キャンセル
          </button>
          <button class="btn btn-danger" onclick="executeDelete()">
            ゴミ箱に移動する
          </button>
        </div>
      </div>
    </div>

    <script>
      let allResources = [];
      let filteredResources = [];
      let sortState = { key: null, dir: "asc" };
      const openGroups = new Set(); // 現在開いているグループキーのセット（フィルタ再描画を跨いで保持）
      const seenGroups = new Set(); // 一度でも描画されたグループキー（新規グループのデフォルト開閉判定用）

      async function loadData() {
        document.getElementById("loading").style.display = "block";
        document.getElementById("table-wrapper").style.display = "none";

        try {
          const res = await fetch("/get-unused-resources");
          const data = await res.json();
          allResources = data.resources || [];

          // プロジェクトフィルターを更新
          const projects = [
            ...new Set(allResources.map((r) => r.projectName)),
          ].sort();
          const projectFilter = document.getElementById("project-filter");
          projectFilter.innerHTML =
            '<option value="">すべてのプロジェクト</option>' +
            projects
              .map(
                (p) => `<option value="${escHtml(p)}">${escHtml(p)}</option>`,
              )
              .join("");

          applyFilter();
        } catch (e) {
          document.getElementById("loading").textContent =
            "エラー: 取得に失敗しました。";
          console.error(e);
        }
      }

      function applyFilter() {
        const searchVal = document.getElementById("search").value.toLowerCase();
        const typeVal = document.getElementById("type-filter").value;
        const projVal = document.getElementById("project-filter").value;

        let result = allResources.filter((r) => {
          if (searchVal && !r.fileName.toLowerCase().includes(searchVal))
            return false;
          if (typeVal && r.resourceType !== typeVal) return false;
          if (projVal && r.projectName !== projVal) return false;
          return true;
        });

        // ソート適用
        if (sortState.key) {
          const key = sortState.key;
          const dir = sortState.dir === "asc" ? 1 : -1;
          result = [...result].sort(
            (a, b) => dir * a[key].localeCompare(b[key]),
          );
        }

        filteredResources = result;
        renderTable(filteredResources);
      }

      // ---- ソート ----

      function setSort(key) {
        if (sortState.key === key) {
          sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
        } else {
          sortState.key = key;
          sortState.dir = "asc";
        }
        updateSortHeaders();
        applyFilter();
      }

      function updateSortHeaders() {
        document.querySelectorAll("thead th.sortable").forEach((th) => {
          th.classList.remove("sort-asc", "sort-desc");
          const m = (th.getAttribute("onclick") || "").match(
            /setSort\('([^']+)'\)/,
          );
          if (m && m[1] === sortState.key) {
            th.classList.add(
              sortState.dir === "asc" ? "sort-asc" : "sort-desc",
            );
          }
        });
      }

      // ---- グループ化ヘルパー ----

      function groupByFolder(resources) {
        const map = new Map();
        for (const r of resources) {
          const folder = r.relativePath.split("/")[0] || "others";
          const key = r.projectName + "/" + folder;
          if (!map.has(key)) map.set(key, []);
          map.get(key).push(r);
        }
        return map;
      }

      // ---- 描画 ----

      function renderTable(resources) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("table-wrapper").style.display = "block";

        const tbody = document.getElementById("tbody");
        tbody.innerHTML = "";

        if (resources.length === 0) {
          document.getElementById("empty-msg").style.display = "block";
          updateCount();
          return;
        }
        document.getElementById("empty-msg").style.display = "none";

        const IMAGE_EXTS = new Set([
          ".jpg",
          ".jpeg",
          ".png",
          ".gif",
          ".bmp",
          ".svg",
          ".webp",
        ]);

        const groups = groupByFolder(resources);

        for (const [groupKey, entries] of groups) {
          // 初回登場グループはデフォルトで開く
          if (!seenGroups.has(groupKey)) {
            seenGroups.add(groupKey);
            openGroups.add(groupKey);
          }
          const isOpen = openGroups.has(groupKey);

          // --- グループヘッダー行 ---
          const headerTr = document.createElement("tr");
          headerTr.className = "accordion-header";
          headerTr.dataset.groupKey = groupKey;

          // グループ全選択チェックボックス
          const checkTd = document.createElement("td");
          const groupCb = document.createElement("input");
          groupCb.type = "checkbox";
          groupCb.className = "group-check";
          groupCb.addEventListener("change", (e) => {
            e.stopPropagation();
            toggleGroupCheck(groupKey, e.target.checked);
          });
          checkTd.appendChild(groupCb);

          // ラベル（クリックで開閉）
          const labelTd = document.createElement("td");
          labelTd.colSpan = 5;
          labelTd.style.cursor = "pointer";
          const labelDiv = document.createElement("div");
          labelDiv.className = "accordion-label";
          const iconEl = document.createElement("i");
          iconEl.className = "accordion-icon " + (isOpen ? "open" : "closed");
          const textNode = document.createElement("span");
          textNode.innerHTML =
            `📁 <strong>${escHtml(groupKey)}</strong>` +
            ` <span style="font-weight:normal;color:#888">(${entries.length} 件)</span>`;
          labelDiv.appendChild(iconEl);
          labelDiv.appendChild(textNode);
          labelTd.appendChild(labelDiv);
          labelTd.addEventListener("click", () => toggleGroup(groupKey));

          headerTr.appendChild(checkTd);
          headerTr.appendChild(labelTd);
          tbody.appendChild(headerTr);

          // --- 子行 ---
          for (const r of entries) {
            const ext = r.fileName
              .substring(r.fileName.lastIndexOf("."))
              .toLowerCase();
            const isImage = IMAGE_EXTS.has(ext);
            const encodedPath = btoa(unescape(encodeURIComponent(r.filePath)));
            const thumbCell = isImage
              ? `<img class="thumb" src="/serve-file?path=${encodeURIComponent(encodedPath)}" alt="${escHtml(r.fileName)}" loading="lazy" />`
              : `<div class="icon-file">${fileIcon(r.resourceType)}</div>`;
            const typeClass =
              "tag-" + (r.resourceType || "others").toLowerCase();

            const tr = document.createElement("tr");
            tr.className = "data-row";
            tr.dataset.groupKey = groupKey;
            if (!isOpen) tr.style.display = "none";

            // チェックボックスは DOM API で作成（パスに特殊文字があっても安全）
            const cbTd = document.createElement("td");
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.className = "row-check";
            cb.dataset.path = r.filePath;
            cb.addEventListener("change", () => {
              updateGroupHeaderCheck(groupKey);
              updateDeleteBtn();
            });
            cbTd.appendChild(cb);
            tr.appendChild(cbTd);

            tr.insertAdjacentHTML(
              "beforeend",
              `<td>${thumbCell}</td>` +
                `<td class="path-text">${escHtml(r.fileName)}</td>` +
                `<td class="path-text">${escHtml(r.relativePath)}</td>` +
                `<td><span class="tag ${escAttr(typeClass)}">${escHtml(r.resourceType || "others")}</span></td>` +
                `<td>${escHtml(r.projectName)}</td>`,
            );
            tbody.appendChild(tr);
          }
        }

        updateCount();
      }

      // ---- アコーディオン操作 ----

      function setGroupVisibility(groupKey, open) {
        const tbody = document.getElementById("tbody");
        if (open) {
          openGroups.add(groupKey);
        } else {
          openGroups.delete(groupKey);
        }
        // アイコン更新
        const headerRow = Array.from(
          tbody.querySelectorAll("tr.accordion-header"),
        ).find((tr) => tr.dataset.groupKey === groupKey);
        if (headerRow) {
          const icon = headerRow.querySelector(".accordion-icon");
          if (icon)
            icon.className = "accordion-icon " + (open ? "open" : "closed");
        }
        // 子行の表示切り替え
        Array.from(tbody.querySelectorAll("tr.data-row"))
          .filter((tr) => tr.dataset.groupKey === groupKey)
          .forEach((tr) => {
            tr.style.display = open ? "" : "none";
          });
      }

      function toggleGroup(groupKey) {
        setGroupVisibility(groupKey, !openGroups.has(groupKey));
      }

      function expandAll() {
        document.querySelectorAll("tr.accordion-header").forEach((tr) => {
          setGroupVisibility(tr.dataset.groupKey, true);
        });
      }

      function collapseAll() {
        document.querySelectorAll("tr.accordion-header").forEach((tr) => {
          setGroupVisibility(tr.dataset.groupKey, false);
        });
      }

      // ---- グループ内チェックボックス ----

      function toggleGroupCheck(groupKey, checked) {
        const tbody = document.getElementById("tbody");
        Array.from(tbody.querySelectorAll("tr.data-row"))
          .filter((tr) => tr.dataset.groupKey === groupKey)
          .forEach((tr) => {
            const cb = tr.querySelector(".row-check");
            if (cb) cb.checked = checked;
          });
        updateDeleteBtn();
      }

      function updateGroupHeaderCheck(groupKey) {
        const tbody = document.getElementById("tbody");
        const checks = Array.from(tbody.querySelectorAll("tr.data-row"))
          .filter((tr) => tr.dataset.groupKey === groupKey)
          .map((tr) => tr.querySelector(".row-check"))
          .filter(Boolean);
        const headerRow = Array.from(
          tbody.querySelectorAll("tr.accordion-header"),
        ).find((tr) => tr.dataset.groupKey === groupKey);
        if (!headerRow) return;
        const groupCb = headerRow.querySelector(".group-check");
        if (!groupCb) return;
        const allChecked = checks.length > 0 && checks.every((cb) => cb.checked);
        const someChecked = checks.some((cb) => cb.checked);
        groupCb.checked = allChecked;
        groupCb.indeterminate = someChecked && !allChecked;
      }

      // ---- ユーティリティ ----

      function fileIcon(type) {
        switch ((type || "").toLowerCase()) {
          case "sound":
          case "bgm":
            return "🎵";
          case "video":
            return "🎬";
          default:
            return "📄";
        }
      }

      function updateCount() {
        const checked = document.querySelectorAll(".row-check:checked").length;
        const total = filteredResources.length;
        document.getElementById("count").textContent =
          `${total} 件 / 選択: ${checked} 件`;
        document.getElementById("delete-btn").disabled = checked === 0;
        const allChecks = document.querySelectorAll(".row-check");
        document.getElementById("check-all").checked =
          total > 0 && checked === allChecks.length;
      }

      function updateDeleteBtn() {
        updateCount();
      }

      function selectAll() {
        document
          .querySelectorAll(".row-check")
          .forEach((cb) => (cb.checked = true));
        document.querySelectorAll(".group-check").forEach((cb) => {
          cb.checked = true;
          cb.indeterminate = false;
        });
        updateCount();
      }
      function deselectAll() {
        document
          .querySelectorAll(".row-check")
          .forEach((cb) => (cb.checked = false));
        document.querySelectorAll(".group-check").forEach((cb) => {
          cb.checked = false;
          cb.indeterminate = false;
        });
        updateCount();
      }
      function toggleAll(master) {
        document
          .querySelectorAll(".row-check")
          .forEach((cb) => (cb.checked = master.checked));
        document.querySelectorAll(".group-check").forEach((cb) => {
          cb.checked = master.checked;
          cb.indeterminate = false;
        });
        updateCount();
      }

      function getCheckedPaths() {
        return [...document.querySelectorAll(".row-check:checked")].map(
          (cb) => cb.dataset.path,
        );
      }

      function confirmDelete() {
        const paths = getCheckedPaths();
        if (paths.length === 0) return;
        document.getElementById("modal-body").innerHTML =
          `<strong>${paths.length} 件</strong> のファイルをゴミ箱に移動します。<br><br>` +
          `<strong style="color:#c0392b">⚠ 変数などで動的に参照されている可能性があります。ご注意ください。</strong><br><br>` +
          `<strong style="color:#c0392b">⚠ 削除したファイルは元に戻せません。必ずバックアップを取ったうえで実行してください。</strong><br><br>`;
        document.getElementById("modal-overlay").classList.add("active");
      }

      function closeModal() {
        document.getElementById("modal-overlay").classList.remove("active");
      }

      async function executeDelete() {
        closeModal();
        const paths = getCheckedPaths();
        if (paths.length === 0) return;

        try {
          const res = await fetch("/delete-files", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ files: paths }),
          });
          const result = await res.json();

          if (result.errors && result.errors.length > 0) {
            alert(
              "一部のファイルの削除に失敗しました:\n" +
                result.errors.join("\n"),
            );
          }

          // 削除済みファイルを allResources から除去して再描画
          const deletedSet = new Set(result.deleted || []);
          allResources = allResources.filter(
            (r) => !deletedSet.has(r.filePath),
          );
          applyFilter();
        } catch (e) {
          alert("削除処理中にエラーが発生しました: " + e);
          console.error(e);
        }
      }

      function escHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
      function escAttr(str) {
        return escHtml(str);
      }

      loadData();
    </script>
  </body>
</html>
