<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>未使用リソース検出</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f2f5;
        color: #333;
        margin: 0;
        padding: 20px;
      }
      h1 {
        margin: 0 0 6px 0;
        font-size: 22px;
        color: #c0392b;
      }
      .subtitle {
        font-size: 13px;
        color: #666;
        margin-bottom: 16px;
        line-height: 1.6;
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
      }
      #toolbar input[type="text"] {
        flex: 1;
        min-width: 200px;
        padding: 7px 12px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
        transition: border-color 0.2s;
      }
      #toolbar input[type="text"]:focus {
        border-color: #c0392b;
      }
      #toolbar select {
        padding: 7px 12px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: #fff;
        outline: none;
        cursor: pointer;
      }
      #count {
        font-size: 13px;
        color: #666;
        margin-left: auto;
      }
      .btn {
        padding: 7px 14px;
        font-size: 13px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn-outline {
        background: #fff;
        border: 1px solid #ccc;
        color: #444;
      }
      .btn-danger {
        background: #c0392b;
        color: #fff;
      }
      .btn-danger:disabled {
        background: #e9a9a3;
        cursor: not-allowed;
        opacity: 1;
      }
      .btn-refresh {
        background: #3498db;
        color: #fff;
      }
      .table-wrapper {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      thead {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #c0392b;
        color: #fff;
      }
      thead th {
        padding: 10px 12px;
        text-align: left;
        user-select: none;
        white-space: nowrap;
      }
      tbody tr:nth-child(even) {
        background: #fdf4f4;
      }
      tbody tr:hover {
        background: #fce8e8;
      }
      tbody td {
        padding: 8px 12px;
        border-bottom: 1px solid #f0e0e0;
        vertical-align: middle;
      }
      .thumb {
        width: 56px;
        height: 42px;
        object-fit: cover;
        border-radius: 3px;
        border: 1px solid #ddd;
        display: block;
      }
      .icon-file {
        width: 56px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        color: #aaa;
      }
      .tag {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: bold;
        text-transform: uppercase;
        color: #fff;
      }
      .tag-image {
        background: #27ae60;
      }
      .tag-bgimage {
        background: #2980b9;
      }
      .tag-fgimage {
        background: #8e44ad;
      }
      .tag-sound {
        background: #e67e22;
      }
      .tag-bgm {
        background: #16a085;
      }
      .tag-video {
        background: #d35400;
      }
      .tag-others {
        background: #7f8c8d;
      }
      .path-text {
        font-family: monospace;
        font-size: 12px;
        word-break: break-all;
      }
      #empty-msg {
        text-align: center;
        padding: 40px;
        color: #888;
        font-size: 15px;
      }
      /* モーダル */
      #modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }
      #modal-overlay.active {
        display: flex;
      }
      #modal {
        background: #fff;
        border-radius: 8px;
        padding: 28px 32px;
        max-width: 480px;
        width: 90%;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }
      #modal h2 {
        margin: 0 0 12px 0;
        font-size: 18px;
        color: #c0392b;
      }
      #modal p {
        font-size: 14px;
        line-height: 1.7;
        margin: 0 0 20px 0;
      }
      #modal .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      #loading {
        text-align: center;
        padding: 40px;
        color: #888;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <h1>⚠️ 未使用リソース検出</h1>
    <p class="subtitle">
      シナリオ・スクリプトファイルから参照されていないリソースファイルの一覧です。<br />
      変数による動的参照は検出できないため、削除前に必ずご確認ください。<br />
    </p>

    <div id="toolbar">
      <input
        type="text"
        id="search"
        placeholder="ファイル名で絞り込み..."
        oninput="applyFilter()"
      />
      <select id="type-filter" onchange="applyFilter()">
        <option value="">すべてのリソースタイプ</option>
        <option value="image">image</option>
        <option value="bgimage">bgimage</option>
        <option value="fgimage">fgimage</option>
        <option value="sound">sound</option>
        <option value="bgm">bgm</option>
        <option value="video">video</option>
        <option value="others">others</option>
      </select>
      <select id="project-filter" onchange="applyFilter()">
        <option value="">すべてのプロジェクト</option>
      </select>
      <button class="btn btn-outline" onclick="selectAll()">全選択</button>
      <button class="btn btn-outline" onclick="deselectAll()">全解除</button>
      <button class="btn btn-refresh" onclick="loadData()">
        🔄 最新の情報に更新
      </button>
      <button
        class="btn btn-danger"
        id="delete-btn"
        disabled
        onclick="confirmDelete()"
      >
        選択したファイルをゴミ箱に移動
      </button>
      <span id="count"></span>
    </div>

    <div id="loading">読み込み中...</div>
    <div class="table-wrapper" id="table-wrapper" style="display: none">
      <table>
        <thead>
          <tr>
            <th>
              <input
                type="checkbox"
                id="check-all"
                onchange="toggleAll(this)"
              />
            </th>
            <th>サムネイル</th>
            <th>ファイル名</th>
            <th>相対パス</th>
            <th>リソースタイプ</th>
            <th>プロジェクト</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty-msg" style="display: none">
        未使用リソースは見つかりませんでした。
      </div>
    </div>

    <!-- 削除確認モーダル -->
    <div id="modal-overlay">
      <div id="modal">
        <h2>⚠️ ゴミ箱に移動する前に確認</h2>
        <p id="modal-body"></p>
        <div class="modal-actions">
          <button class="btn btn-outline" onclick="closeModal()">
            キャンセル
          </button>
          <button class="btn btn-danger" onclick="executeDelete()">
            ゴミ箱に移動する
          </button>
        </div>
      </div>
    </div>

    <script>
      let allResources = [];
      let filteredResources = [];

      async function loadData() {
        document.getElementById("loading").style.display = "block";
        document.getElementById("table-wrapper").style.display = "none";

        try {
          const res = await fetch("/get-unused-resources");
          const data = await res.json();
          allResources = data.resources || [];

          // プロジェクトフィルターを更新
          const projects = [
            ...new Set(allResources.map((r) => r.projectName)),
          ].sort();
          const projectFilter = document.getElementById("project-filter");
          projectFilter.innerHTML =
            '<option value="">すべてのプロジェクト</option>' +
            projects
              .map(
                (p) => `<option value="${escHtml(p)}">${escHtml(p)}</option>`,
              )
              .join("");

          applyFilter();
        } catch (e) {
          document.getElementById("loading").textContent =
            "エラー: 取得に失敗しました。";
          console.error(e);
        }
      }

      function applyFilter() {
        const searchVal = document.getElementById("search").value.toLowerCase();
        const typeVal = document.getElementById("type-filter").value;
        const projVal = document.getElementById("project-filter").value;

        filteredResources = allResources.filter((r) => {
          if (searchVal && !r.fileName.toLowerCase().includes(searchVal))
            return false;
          if (typeVal && r.resourceType !== typeVal) return false;
          if (projVal && r.projectName !== projVal) return false;
          return true;
        });

        renderTable(filteredResources);
      }

      function renderTable(resources) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("table-wrapper").style.display = "block";

        const tbody = document.getElementById("tbody");
        tbody.innerHTML = "";

        if (resources.length === 0) {
          document.getElementById("empty-msg").style.display = "block";
          updateCount();
          return;
        }
        document.getElementById("empty-msg").style.display = "none";

        const IMAGE_EXTS = new Set([
          ".jpg",
          ".jpeg",
          ".png",
          ".gif",
          ".bmp",
          ".svg",
          ".webp",
        ]);

        resources.forEach((r) => {
          const ext = r.fileName
            .substring(r.fileName.lastIndexOf("."))
            .toLowerCase();
          const isImage = IMAGE_EXTS.has(ext);
          const encodedPath = btoa(unescape(encodeURIComponent(r.filePath)));

          const thumbCell = isImage
            ? `<img class="thumb" src="/serve-file?path=${encodeURIComponent(encodedPath)}" alt="${escHtml(r.fileName)}" loading="lazy" />`
            : `<div class="icon-file">${fileIcon(r.resourceType)}</div>`;

          const typeClass = "tag-" + (r.resourceType || "others").toLowerCase();

          const tr = document.createElement("tr");
          tr.dataset.path = r.filePath;
          tr.innerHTML = `
            <td><input type="checkbox" class="row-check" data-path="${escAttr(r.filePath)}" onchange="updateDeleteBtn()" /></td>
            <td>${thumbCell}</td>
            <td class="path-text">${escHtml(r.fileName)}</td>
            <td class="path-text">${escHtml(r.relativePath)}</td>
            <td><span class="tag ${escAttr(typeClass)}">${escHtml(r.resourceType || "others")}</span></td>
            <td>${escHtml(r.projectName)}</td>
          `;
          tbody.appendChild(tr);
        });

        updateCount();
      }

      function fileIcon(type) {
        switch ((type || "").toLowerCase()) {
          case "sound":
          case "bgm":
            return "🎵";
          case "video":
            return "🎬";
          default:
            return "📄";
        }
      }

      function updateCount() {
        const checked = document.querySelectorAll(".row-check:checked").length;
        const total = filteredResources.length;
        document.getElementById("count").textContent =
          `${total} 件 / 選択: ${checked} 件`;
        document.getElementById("delete-btn").disabled = checked === 0;
        document.getElementById("check-all").checked =
          total > 0 &&
          checked === document.querySelectorAll(".row-check").length;
      }

      function updateDeleteBtn() {
        updateCount();
      }

      function selectAll() {
        document
          .querySelectorAll(".row-check")
          .forEach((cb) => (cb.checked = true));
        updateCount();
      }
      function deselectAll() {
        document
          .querySelectorAll(".row-check")
          .forEach((cb) => (cb.checked = false));
        updateCount();
      }
      function toggleAll(master) {
        document
          .querySelectorAll(".row-check")
          .forEach((cb) => (cb.checked = master.checked));
        updateCount();
      }

      function getCheckedPaths() {
        return [...document.querySelectorAll(".row-check:checked")].map(
          (cb) => cb.dataset.path,
        );
      }

      function confirmDelete() {
        const paths = getCheckedPaths();
        if (paths.length === 0) return;
        document.getElementById("modal-body").innerHTML =
          `<strong>${paths.length} 件</strong> のファイルをゴミ箱に移動します。<br><br>` +
          `<strong style="color:#c0392b">⚠ 変数による動的参照がある場合、実際には使用されているファイルが含まれる可能性があります。</strong><br><br>` +
          `削除したファイルは OS のゴミ箱から元に戻すことができます。本当に移動しますか？`;
        document.getElementById("modal-overlay").classList.add("active");
      }

      function closeModal() {
        document.getElementById("modal-overlay").classList.remove("active");
      }

      async function executeDelete() {
        closeModal();
        const paths = getCheckedPaths();
        if (paths.length === 0) return;

        try {
          const res = await fetch("/delete-files", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ files: paths }),
          });
          const result = await res.json();

          if (result.errors && result.errors.length > 0) {
            alert(
              "一部のファイルの削除に失敗しました:\n" +
                result.errors.join("\n"),
            );
          }

          // 削除済みファイルを allResources から除去して再描画
          const deletedSet = new Set(result.deleted || []);
          allResources = allResources.filter(
            (r) => !deletedSet.has(r.filePath),
          );
          applyFilter();
        } catch (e) {
          alert("削除処理中にエラーが発生しました: " + e);
          console.error(e);
        }
      }

      function escHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
      function escAttr(str) {
        return escHtml(str);
      }

      loadData();
    </script>
  </body>
</html>
